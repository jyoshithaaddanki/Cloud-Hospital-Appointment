<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Hospital Appointment System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏥 Cloud Hospital</h1>
    <p>Online Appointment Management System</p>
</header>

<div class="container">

    <section class="card">
        <h2>Book an Appointment</h2>

        <form id="appointmentForm">

            <label>Patient Name</label>
            <input type="text" id="name" placeholder="Enter patient name" required>

            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email" required>

            <label>Doctor</label>
            <select id="doctor" required>
                <option value="">Select Doctor</option>
                <option>Dr. Ravi - Cardiologist</option>
                <option>Dr. Priya - Dermatologist</option>
                <option>Dr. Kumar - General Physician</option>
                <option>Dr. Anitha - Pediatrician</option>
            </select>

            <label>Appointment Date</label>
            <input type="date" id="date" required>

            <label>Appointment Time</label>
            <input type="time" id="time" required>

            <button type="submit">Book Appointment</button>

        </form>
    </section>

    <section class="card">
        <h2>Appointment Details</h2>
        <div id="appointmentList">
            <p>No appointments booked yet.</p>
        </div>
    </section>

</div>

<footer>
    <p>© 2026 Cloud Hospital Appointment System</p>
</footer>

<script src="script.js"></script>

</body>
</html>
